services:
  mongodb:
    image: mongo:latest # Usa la imagen oficial
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db # Persiste los datos en un volumen
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js # Script de inicialización
    environment:
      # Opcional: configura usuario y contraseña
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: hacktoberfest

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo-data: # Define el volumen para persistencia

